version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: prova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prova
      POSTGRES_PASSWORD: prova_dev_password
      POSTGRES_DB: prova_dev
    ports:
      - "5432:5432"
    volumes:
      - prova_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prova -d prova_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: prova-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - prova_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  prova_postgres_data:
  prova_redis_data: